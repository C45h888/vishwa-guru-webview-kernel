# =====================================================================
# Temple Trust Management System — Local Development Stack
# =====================================================================
#
# Purpose:  Stand up the runtime substrate for local development.
#           Brings up Redis, optional Postgres (auto-skipped when
#           DATABASE_URL is set), and the PHP runtime (Phase 2 Dockerfile).
#
# Doctrine: this stack is for LOCAL DEV ONLY. Production runs against
#           Neon PostgreSQL + hosted Redis (REDIS_URL/DATABASE_URL).
#           Do not deploy this docker-compose to a server.
#
# Usage:
#   docker compose up -d   # start (uses .env for all configuration)
#   docker compose down     # stop
#   docker compose down -v # stop + wipe volumes (fresh state)
#
# ─── ENVIRONMENT FILE ─────────────────────────────────────────────────
# This stack reads from .env — the single source of truth for all
# configuration. All environment variables are defined there.
#
# ─── DATABASE MODE (AUTO-DETECT) ──────────────────────────────────────
# The app/worker containers read DATABASE_URL from .env to decide
# which database mode to run in:
#
#   LOCAL mode  — DATABASE_URL is empty/unset
#                 → app talks to local `postgres` container
#                 → `php artisan migrate --force` runs on container start
#                 → uses discrete DB_HOST=postgres, DB_PORT=5432 etc.
#
#   NEON mode   — DATABASE_URL is set to a Neon connection string
#                 → app talks directly to Neon via DATABASE_URL
#                 → skips `php artisan migrate` (Neon already migrated)
#                 → discards DB_HOST to avoid local Postgres shadowing
#                 → the local `postgres` container still starts (cheap, idle)
#                 but is NOT used by the app/worker containers
#
# =====================================================================

services:
  # ── Redis (Phase 2 — fast-path cache + queue + idempotency) ────────
  redis:
    image: redis:7-alpine
    container_name: temple-trust-redis
    restart: unless-stopped
    env_file:
      - .env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # 6380 on host → 6379 in-container. Host port is decoupled from the
      # internal 6379 because an unrelated `crypto-ai-anal-*` redis already
      # publishes 127.0.0.1:6379. The app/worker reach this redis via the
      # `redis` service hostname on the shared compose network (port 6379
      # in-container), so REDIS_PORT stays 6379 in config and only this
      # public host mapping shifts to 6380.
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ── PostgreSQL (Phase 0.5 — Neon-shaped local schema) ───────────────
  # Always started; in NEON mode the app ignores it. Kept as a fallback
  # for ops who want to test DB locally without depending on Neon uptime.
  postgres:
    image: postgres:15-alpine
    container_name: temple-trust-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-temple_trust}
      POSTGRES_USER: ${DB_USERNAME:-temple_trust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-temple_trust} -d ${DB_DATABASE:-temple_trust}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PHP runtime (Phase 2 — Dockerfile builds ext-redis + extensions) ─
  # DATABASE_MODE is computed from .env at compose time. The
  # bootstrap script inlined in `command` then decides whether to run
  # `migrate` and what DB_HOST the app should see.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temple-trust-app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    # Public DNS resolvers — override the host DNS because the corporate
    # DNS server returns REFUSED for *.aws.neon.tech domains. Cloudflare
    # (1.1.1.1) and Google (8.8.8.8) both resolve Neon pooler endpoints.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             if [ -z \"$$DATABASE_URL\" ]; then
               echo '[container] LOCAL mode: running migrations against local Postgres';
               php artisan migrate --force;
             else
               echo '[container] NEON mode: skipping migrate (Neon already migrated)';
             fi &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  # ── Queue worker (Phase 2 — processes queued jobs) ──────────────────
  # Runs `php artisan queue:work redis` continuously.
  # In NEON mode, talks directly to Neon via DATABASE_URL.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temple-trust-worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             php artisan queue:work redis --sleep=3 --tries=3 --timeout=60"

volumes:
  redis-data:
  postgres-data:
