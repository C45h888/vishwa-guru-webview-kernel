# =====================================================================
# Temple Trust Management System — Local Development Stack
# =====================================================================
#
# Purpose:  Stand up the runtime substrate for local development.
#           Brings up Redis, optional Postgres (auto-skipped when
#           DATABASE_URL is set), and the PHP runtime (Phase 2 Dockerfile).
#
# Doctrine: this stack is for LOCAL DEV ONLY. Production runs against
#           Neon PostgreSQL + hosted Redis (REDIS_URL/DATABASE_URL).
#           Do not deploy this docker-compose to a server.
#
# Usage:
#   docker compose up -d          # start all services (auto-detects mode)
#   docker compose down           # stop
#   docker compose down -v        # stop + wipe volumes (fresh state)
#
# ─── DATABASE MODE (AUTO-DETECT) ──────────────────────────────────────
# The composer reads the host's .env to decide which mode to run in:
#
#   LOCAL mode  — DATABASE_URL is empty/unset
#                 → app talks to local `postgres` container
#                 → `php artisan migrate --force` runs on container start
#                 → uses discrete DB_HOST=postgres, DB_PORT=5432 etc.
#
#   NEON mode   — DATABASE_URL is set to a Neon connection string
#                 → app talks directly to Neon via DATABASE_URL
#                 → skips `php artisan migrate` (Neon already migrated)
#                 → discards DB_HOST to avoid local Postgres shadowing
#                 → the local `postgres` container still starts (cheap, idle)
#                 but is NOT used by the app/worker containers
#
# Connection details (override via .env):
#   Postgres:  localhost:5432, db=temple_trust, user=temple_trust
#   Redis:     localhost:6379, password=dev (AOF on, durable across restarts)
#   PHP app:   localhost:8000
#   Worker:    no exposed port — runs `php artisan queue:work redis`
#              continuously; logs to docker compose logs -f worker
#
# =====================================================================

services:
  # ── Redis (Phase 2 — fast-path cache + queue + idempotency) ────────
  redis:
    image: redis:7-alpine
    container_name: temple-trust-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-dev}
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev}", "--no-auth-warning", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ── PostgreSQL (Phase 0.5 — Neon-shaped local schema) ───────────────
  # Always started; in NEON mode the app ignores it. Kept as a fallback
  # for ops who want to test DB locally without depending on Neon uptime.
  postgres:
    image: postgres:15-alpine
    container_name: temple-trust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-temple_trust}
      POSTGRES_USER: ${DB_USERNAME:-temple_trust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-temple_trust} -d ${DB_DATABASE:-temple_trust}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PHP runtime (Phase 2 — Dockerfile builds ext-redis + extensions) ─
  # DATABASE_MODE is computed from the host .env at compose time. The
  # bootstrap script inlined in `command` then decides whether to run
  # `migrate` and what DB_HOST the app should see.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temple-trust-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      # DATABASE_URL is the single source of truth when set — it overrides
      # every discrete DB_* key. The app/worker below still see the discrete
      # keys, but only USE them when DATABASE_URL is empty.
      DATABASE_URL: ${DATABASE_URL:-}
      # Doctrine: in NEON mode the runtime MUST use the `neon` connection
      # block (config/database.php) which forces sslmode=require and
      # application_name=temple-trust. The `pgsql` block does NOT enforce
      # SSL — using it leaks financial data in plaintext.
      DB_CONNECTION: neon
      # Intentionally omit DB_HOST from compose env — config/database.php
      # will read it from .env. In NEON mode .env has no DB_HOST so
      # the URL parse path wins. In LOCAL mode .env has DB_HOST=postgres
      # (the docker-compose-managed .env, separate from the host .env
      # users use on production Neon).
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-temple_trust}
      DB_USERNAME: ${DB_USERNAME:-temple_trust}
      DB_PASSWORD: ${DB_PASSWORD:-dev}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             if [ -z \"$$DATABASE_URL\" ]; then
               echo '[container] LOCAL mode: running migrations against local Postgres';
               php artisan migrate --force;
             else
               echo '[container] NEON mode: skipping migrate (Neon already migrated)';
             fi &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # ── Queue worker (Phase 2 — separate container, doctrine-aligned) ─────
  # Doctrine: HTTP and async are separate concerns. One stuck worker
  # does NOT take down donation intake — donors can still POST /donate
  # while the worker is recovering. This service runs
  # `php artisan queue:work redis` continuously, processing jobs dispatched
  # by the app service. Per-job retry policy is enforced by each job's
  # $tries/$backoff properties (see AbstractQueuedJob); these CLI flags
  # are the worker-level fallback.
  #
  # In NEON mode the worker also talks to Neon directly via DATABASE_URL.
  # In LOCAL mode it falls back to the local `postgres` container.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temple-trust-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      # Doctrine: in NEON mode the worker MUST use the `neon` connection
      # block (config/database.php) which forces sslmode=require. The
      # `pgsql` block bypasses SSL — using it sends queue processing data
      # in plaintext.
      DB_CONNECTION: neon
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-temple_trust}
      DB_USERNAME: ${DB_USERNAME:-temple_trust}
      DB_PASSWORD: ${DB_PASSWORD:-dev}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      QUEUE_GENERAL_TRIES: ${QUEUE_GENERAL_TRIES:-3}
      QUEUE_GENERAL_BACKOFF: ${QUEUE_GENERAL_BACKOFF:-10,60,300}
      QUEUE_FINANCIAL_TRIES: ${QUEUE_FINANCIAL_TRIES:-1}
      QUEUE_FINANCIAL_BACKOFF: ${QUEUE_FINANCIAL_BACKOFF:-0}
      QUEUE_WORKER_MAX_TIME: ${QUEUE_WORKER_MAX_TIME:-3600}
      QUEUE_WORKER_SLEEP: ${QUEUE_WORKER_SLEEP:-3}
      QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-60}
      QUEUE_FAILED_RETENTION_HOURS: ${QUEUE_FAILED_RETENTION_HOURS:-720}
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist && exec php artisan queue:work redis
        --tries=$$QUEUE_GENERAL_TRIES
        --backoff=$$QUEUE_GENERAL_BACKOFF
        --max-time=$$QUEUE_WORKER_MAX_TIME
        --sleep=$$QUEUE_WORKER_SLEEP
        --timeout=$$QUEUE_WORKER_TIMEOUT
        --verbose"

volumes:
  redis-data:
    name: temple-trust-redis-data
  postgres-data:
    name: temple-trust-postgres-data
