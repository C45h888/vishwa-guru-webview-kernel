# =====================================================================
# vsrsms.in — canonical Nginx ingress (source of truth)
# =====================================================================
#
# Deploy:  sudo ln -sf <repo>/deploy/nginx/vsrsms.in.conf \
#                        /etc/nginx/sites-available/vsrsms.in
#          sudo ln -sf /etc/nginx/sites-available/vsrsms.in \
#                      /etc/nginx/sites-enabled/vsrsms.in
#          sudo nginx -t && sudo systemctl reload nginx
#
# Doctrine: Nginx is the SOLE public ingress. TLS terminates here;
#           the app is reached only via 127.0.0.1:8000 (localhost-bound
#           in docker-compose.yml). Postgres/redis are unpublished.
#           Do NOT add another public entrypoint without updating the
#           ingress contract (AGENTS.md scope / deployment notes).
#
# Certbot owns the "# managed by Certbot" lines. If certbot rewrites
# this file (re-issue, plugin upgrade), commit the result back here so
# the repo stays canonical.
#
# Live state captured 2026-09-30 (post certbot --nginx --redirect).
# =====================================================================

server {

    server_name vsrsms.in www.vsrsms.in;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vsrsms.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vsrsms.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.vsrsms.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = vsrsms.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name vsrsms.in www.vsrsms.in;
    return 404; # managed by Certbot




}
